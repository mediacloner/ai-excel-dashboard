models:
  schema_mapping:
    name: "qwen3:8b"
    num_ctx: 8192
    keep_alive: "5m"
    temperature: 0.1
    format: "json"
  text_to_sql:
    name: "qwen3:8b"
    num_ctx: 4096
    keep_alive: "5m"
    temperature: 0.0
    stop: [";"]
  dashboard_agent:
    name: "qwen3:8b"
    num_ctx: 16384
    keep_alive: "5m"
    temperature: 0.3
    # Hard cap so a runaway <think> block can't generate for minutes.
    # 1024 is plenty for any single tool call when reasoning is off.
    num_predict: 1024
    # Disable Qwen3's <think>...</think> blocks entirely. The /no_think
    # prompt directive is unreliable; this is the API-level off switch.
    # Without it Qwen3 spends 800+ tokens thinking before emitting JSON,
    # so a 1024-token cap leaves no room for the actual tool call.
    reasoning: false
  ingestion_agent:
    name: "qwen3:8b"
    num_ctx: 8192
    keep_alive: "5m"
    temperature: 0.1

database:
  engine: "duckdb"
  path: "data/warehouse.duckdb"
  query_timeout_seconds: 10
  max_result_rows: 5000

ingestion:
  sample_rows: 10
  max_columns: 100
  max_file_size_mb: 50
  max_rows: 500000
  allowed_extensions: [".xlsx", ".xls", ".csv"]
  llm_retry_attempts: 3
  upload_dir: "data/uploads"

profiling:
  null_threshold_warning: 0.3
  unique_ratio_categorical: 0.05

langgraph:
  checkpoint_db: "data/langgraph_state.db"
